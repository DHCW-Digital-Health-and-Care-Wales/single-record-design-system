name: Publish the .NET packages to GitHub Packages

# Packs the two .NET token and style layers and pushes them to the GitHub
# Packages NuGet feed, so a .NET app installs them with `dotnet add package`
# instead of building them out of a checkout of this repository (DDR-024).
#
#   DHCW.SingleRecord.Maui    resource dictionaries for native MAUI XAML
#   DHCW.SingleRecord.Blazor  stylesheets for Blazor
#
# Both ship on the same tag and are versioned in lockstep, so they publish
# together or fail together. They run on one macOS job because MAUI needs macOS
# for a complete set of target frameworks; Blazor would pack anywhere.
#
# WHY macOS AND NOT ubuntu
#
#   The workloads decide the target frameworks. ubuntu has maui-android only and
#   cannot build iOS or macCatalyst at all, so a Linux pack silently produces an
#   Android-only package — it succeeds, publishes, and then fails at the first
#   iOS consumer. macOS can build all three, so it is the only host that can
#   produce a complete package. build-maui-testbed.yml still proves the Android
#   TFM on every PR, which is the cheap check; this is the expensive one.
#
# WHY GITHUB PACKAGES AND NOT nuget.org
#
#   The brand marks in this package are NHS Wales and DHCW trademarks and are not
#   covered by its MIT licence. GitHub Packages requires authentication for every
#   install, including public packages — normally a drawback, here the reason it
#   is the right feed. See DDR-024.
#
# WHICH OWNER PUBLISHES
#
#   GitHub Packages scopes a feed to the account that owns it, and consumers
#   authenticate against that account. Run this wherever the MAUI teams can
#   authenticate. The feed URL, the RepositoryUrl in the package and the token
#   are all derived from ${{ github.repository }} so this workflow is correct in
#   whichever repository it runs from, rather than hardcoding one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.2.1. Must match the version in packages/maui and packages/blazor.'
        required: true
        type: string
      dry_run:
        description: 'Pack and verify, but do not push'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Org repo only, and here the guard decides *which feed* the package lands
    # in, not just who runs the job: the push target below is
    # nuget.pkg.github.com/${{ github.repository_owner }}. Run from the personal
    # upstream and DHCW.SingleRecord.Maui publishes to a personal feed that no
    # MAUI team is configured to read, while appearing to have succeeded.
    if: github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Android is part of the pack, and its build needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI workloads
        run: dotnet workload install maui --skip-sign-check

      # Regenerating rather than trusting the commit means a stale Colors.xaml or
      # Icons.xaml cannot be what gets published to every product team.
      - name: Regenerate and verify the design system layer
        run: |
          npm ci
          npm run build:maui
          # Blazor packs from packages/blazor/nuget, which is generated from the
          # built web CSS. Without this the workflow would pack whatever was
          # committed, which is the drift the generator exists to remove.
          npm run build:blazor

      - name: Fail if the generated output was committed stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated output differs from what the build produces. Run 'npm run build:maui && npm run build:blazor' and commit."
            git diff --stat
            exit 1
          fi

      # The tag is what a human types; the version is what consumers resolve.
      # If they disagree, the tag is a lie about what was published.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./packages/maui/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match packages/maui/package.json version $VERSION."
            echo "Bump the version and re-run, or tag v$VERSION."
            exit 1
          fi

          # Both .NET packages ship on this tag, so both must be at it. They are
          # versioned in lockstep with the npm packages — one version number
          # describes the whole design system — and a mismatch here would
          # publish two packages claiming to be the same release while carrying
          # different content.
          BLAZOR=$(node -p "require('./packages/blazor/package.json').version")
          if [ "$BLAZOR" != "$VERSION" ]; then
            echo "::error::packages/blazor is $BLAZOR but packages/maui is $VERSION. Version them together."
            exit 1
          fi
          echo "Publishing $VERSION as $TAG (MAUI and Blazor)"

      - name: Pack
        run: |
          dotnet pack packages/maui/nuget/DHCW.SingleRecord.Maui.csproj \
            -c Release -o nupkg \
            -p:RepositoryUrl=https://github.com/${{ github.repository }}

          # Blazor is a single-target Razor class library, so it packs anywhere
          # — unlike MAUI, which needs macOS for a complete set of target
          # frameworks. It rides along on the same macOS runner rather than
          # getting its own job, because the two must publish or fail together.
          dotnet pack packages/blazor/nuget/DHCW.SingleRecord.Blazor.csproj \
            -c Release -o nupkg \
            -p:RepositoryUrl=https://github.com/${{ github.repository }}

      # Pack succeeding is not the same as the package being usable. Without the
      # buildTransitive targets it installs and silently does nothing, and
      # without every target framework it fails at the first iOS consumer rather
      # than here.
      - name: Verify the package is complete
        run: |
          ls -lh nupkg/

          # Name the package explicitly. This used to be `find … -print -quit`,
          # which took whichever .nupkg the filesystem happened to return first
          # — fine with one package, and silently the wrong one now there are
          # two.
          pkg="nupkg/DHCW.SingleRecord.Maui.${VERSION}.nupkg"
          if [ ! -f "$pkg" ]; then
            echo "::error::$pkg was not produced. Got:"; ls nupkg/; exit 1
          fi

          python3 - "$pkg" "$VERSION" <<'PY'
          import re, sys, zipfile
          pkg, version = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(pkg).namelist()

          problems = []
          if not any(n.startswith('buildTransitive/') and n.endswith('.targets') for n in names):
              problems.append('buildTransitive/*.targets — brand marks would not register')
          if not any(n == 'README.md' for n in names):
              problems.append('README.md')

          brand = [n for n in names if n.startswith('brand/') and n.endswith('.svg')]
          if len(brand) != 11:
              problems.append(f'expected 11 brand marks, found {len(brand)}')

          # Every platform this package claims to support must actually be in it.
          #
          # The TFM in the csproj is `net10.0-android`, but NuGet packs it under
          # the *materialised* platform version — lib/net10.0-android36.0/ — and
          # likewise net10.0-ios18.0 and net10.0-maccatalyst18.0. Matching the
          # literal segment '/net10.0-android/' therefore never hits, and the
          # first real run of this workflow reported all three platforms missing
          # from a package that contained all three.
          #
          # The trailing [0-9.]* is optional, so this holds whether or not the
          # platform version is materialised, and it stays correct when the
          # Android or iOS API level moves. Anchored at lib/ so a stray .dll
          # elsewhere in the package cannot satisfy it.
          for tfm in ('android', 'ios', 'maccatalyst'):
              pattern = re.compile(rf'^lib/net10\.0-{tfm}[0-9.]*/.+\.dll$')
              if not any(pattern.match(n) for n in names):
                  problems.append(f'no assembly for net10.0-{tfm} — packed on the wrong host?')

          if problems:
              print('::error::Package is incomplete: ' + '; '.join(problems))
              print('\n'.join(sorted(names)))
              sys.exit(1)
          print(f'{pkg} OK — v{version}, {len(names)} entries, {len(brand)} brand marks')
          PY

      # Blazor's failure mode is the opposite of MAUI's. MAUI can pack on the
      # wrong host and lose target frameworks; Blazor is a single target and
      # always compiles, but its whole substance is static web assets copied in
      # by the generator. A packaging mistake there produces a package that
      # installs, references cleanly, and styles nothing.
      - name: Verify the Blazor package carries the stylesheets
        run: |
          pkg="nupkg/DHCW.SingleRecord.Blazor.${VERSION}.nupkg"
          if [ ! -f "$pkg" ]; then
            echo "::error::$pkg was not produced. Got:"; ls nupkg/; exit 1
          fi

          python3 - "$pkg" "$VERSION" <<'PY'
          import sys, zipfile
          pkg, version = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(pkg).namelist()

          # An RCL packs wwwroot under staticwebassets/, so match on the tail
          # rather than assuming the prefix.
          def has(tail):
              return any(n.endswith(tail) for n in names)

          problems = []
          for f in ('css/single-record.css', 'css/single-record-dark.css',
                    'css/foundations.css', 'css/sprite.svg'):
              if not has(f):
                  problems.append(f)
          if not has('README.md'):
              problems.append('README.md')

          per_component = [n for n in names if '/css/components/' in n and n.endswith('.css')]
          if len(per_component) < 20:
              problems.append(f'expected 20+ per-component stylesheets, found {len(per_component)}')

          if problems:
              print('::error::Blazor package is missing: ' + '; '.join(problems))
              print('\n'.join(sorted(names)))
              sys.exit(1)
          print(f'{pkg} OK — v{version}, {len(names)} entries, '
                f'{len(per_component)} per-component stylesheets')
          PY

      - name: Push to GitHub Packages
        if: ${{ inputs.dry_run != true }}
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Summary
        run: |
          {
            echo "### DHCW.SingleRecord.Maui $VERSION"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — packed and verified, not pushed."
            else
              echo "Published to \`https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json\`."
            fi
            echo
            echo "Consumers need a \`nuget.config\` pointing at that feed and a PAT with"
            echo "\`read:packages\` — GitHub Packages requires authentication even for public"
            echo "packages. See \`packages/maui/nuget/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
          # The published package on the NuGet feed is the durable copy; this
          # artifact only exists so a dry run has something to inspect. Default
          # retention is 90 days — no reason to hold a .nupkg that long here.
          retention-days: 14
