name: Build MAUI testbed APK

# Builds packages/maui/testbed into an installable Android APK and uploads it as
# a workflow artifact, ready to drop into BrowserStack App Live.
#
# Why CI rather than a laptop: the MAUI Android toolchain is a JDK, the Android
# SDK, and the maui-android workload. Installing that to look at one screen is a
# poor trade, and doing it on one machine proves nothing about anyone else's. Here
# it is reproducible and the build is exercised on every change to the layer.
#
# The APK is signed with the standard Android debug key. That is enough to
# install on a device or upload to App Live, and nowhere near enough to
# distribute — this is a testbed, not a release.

on:
  pull_request:
    paths:
      - 'packages/maui/**'
      - 'foundations/tokens/**'
      - 'foundations/iconography/**'
      - '.github/workflows/build-maui-testbed.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options: [Release, Debug]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The XAML has to be regenerated and re-verified before it is compiled,
      # so a stale committed Colors.xaml or Icons.xaml cannot be what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate and verify the design system layer
        run: |
          npm ci
          npm run build:maui

      - name: Fail if the generated XAML was committed stale
        run: |
          if ! git diff --quiet -- packages/maui/Colors.xaml packages/maui/Icons.xaml; then
            echo "::error::Colors.xaml or Icons.xaml differs from what the generator produces."
            echo "Run 'npm run build:maui' and commit the result."
            git diff --stat -- packages/maui/Colors.xaml packages/maui/Icons.xaml
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Publish APK
        run: |
          dotnet publish packages/maui/testbed/SrTestbed.csproj \
            -f net10.0-android \
            -c "${{ inputs.configuration || 'Release' }}" \
            -p:AndroidPackageFormat=apk

      - name: Collect the APK
        id: collect
        run: |
          mkdir -p artifact
          # Prefer the signed output; that is the one that installs.
          found=$(find packages/maui/testbed/bin -name '*-Signed.apk' -print -quit)
          if [ -z "$found" ]; then
            found=$(find packages/maui/testbed/bin -name '*.apk' -print -quit)
          fi
          if [ -z "$found" ]; then
            echo "::error::No APK was produced."
            find packages/maui/testbed/bin -type f -name '*.apk*' || true
            exit 1
          fi
          cp "$found" artifact/sr-testbed.apk
          ls -lh artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: sr-testbed-apk
          path: artifact/sr-testbed.apk
          if-no-files-found: error
          retention-days: 30
