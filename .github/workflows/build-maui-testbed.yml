name: Build MAUI library and testbed APK

# Two jobs in one: compiles and packs the DHCW.SingleRecord.Maui NuGet library
# that products consume, then builds packages/maui/testbed into an installable
# Android APK and uploads it as a workflow artifact for BrowserStack App Live.
#
# Why CI rather than a laptop: the MAUI Android toolchain is a JDK, the Android
# SDK, and the maui-android workload. Installing that to look at one screen is a
# poor trade, and doing it on one machine proves nothing about anyone else's. Here
# it is reproducible and the build is exercised on every change to the layer.
#
# The APK is signed with the standard Android debug key. That is enough to
# install on a device or upload to App Live, and nowhere near enough to
# distribute — this is a testbed, not a release.

on:
  pull_request:
    paths:
      - 'packages/maui/**'
      - 'foundations/tokens/**'
      - 'foundations/iconography/**'
      - '.github/workflows/build-maui-testbed.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options: [Release, Debug]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The XAML has to be regenerated and re-verified before it is compiled,
      # so a stale committed Colors.xaml or Icons.xaml cannot be what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate and verify the design system layer
        run: |
          npm ci
          npm run build:maui

      - name: Fail if the generated XAML was committed stale
        run: |
          if ! git diff --quiet -- packages/maui/Colors.xaml packages/maui/Icons.xaml; then
            echo "::error::Colors.xaml or Icons.xaml differs from what the generator produces."
            echo "Run 'npm run build:maui' and commit the result."
            git diff --stat -- packages/maui/Colors.xaml packages/maui/Icons.xaml
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # The library products actually install. Until this step existed it was
      # authored but never compiled — the XAML validated as XML and nothing
      # proved the csproj, the targets file or the generated code-behind worked.
      #
      # Only the Android TFM builds here: ubuntu has the maui-android workload
      # and cannot build iOS or macCatalyst at all. A complete multi-TFM pack
      # needs a macOS or Windows runner, which is why this packs nothing.
      - name: Build the NuGet library
        run: |
          dotnet build packages/maui/nuget/DHCW.SingleRecord.Maui.csproj -c Release

      # A build proves it compiles; this proves it packs, that the buildTransitive
      # targets and brand marks are actually in the .nupkg, and that a consumer
      # would get them. NoBuild reuses what was just compiled.
      - name: Pack the NuGet library and check its contents
        run: |
          dotnet pack packages/maui/nuget/DHCW.SingleRecord.Maui.csproj \
            -c Release --no-build -o nupkg
          ls -lh nupkg/

          pkg=$(find nupkg -name '*.nupkg' -print -quit)
          if [ -z "$pkg" ]; then echo "::error::No .nupkg was produced."; exit 1; fi

          # A .nupkg is a zip. Assert on its contents rather than trusting pack.
          python3 - "$pkg" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          missing = []
          # The targets file is what wires the brand marks into a consuming app;
          # if it is absent the package installs and silently does nothing.
          if not any(n.startswith('buildTransitive/') and n.endswith('.targets') for n in names):
              missing.append('buildTransitive/*.targets')
          if not any(n.startswith('brand/') and n.endswith('.svg') for n in names):
              missing.append('brand/*.svg')
          if not any(n.endswith('DHCW.SingleRecord.Maui.dll') for n in names):
              missing.append('lib/**/DHCW.SingleRecord.Maui.dll')
          if not any(n == 'README.md' for n in names):
              missing.append('README.md')
          if missing:
              print('::error::.nupkg is missing: ' + ', '.join(missing))
              print('\n'.join(sorted(names)))
              sys.exit(1)
          brand = sum(1 for n in names if n.startswith('brand/') and n.endswith('.svg'))
          print(f'nupkg OK - {len(names)} entries, {brand} brand marks')
          PY

      - name: Publish APK
        run: |
          dotnet publish packages/maui/testbed/SrTestbed.csproj \
            -f net10.0-android \
            -c "${{ inputs.configuration || 'Release' }}" \
            -p:AndroidPackageFormat=apk

      - name: Collect the APK
        id: collect
        run: |
          mkdir -p artifact
          # Prefer the signed output; that is the one that installs.
          found=$(find packages/maui/testbed/bin -name '*-Signed.apk' -print -quit)
          if [ -z "$found" ]; then
            found=$(find packages/maui/testbed/bin -name '*.apk' -print -quit)
          fi
          if [ -z "$found" ]; then
            echo "::error::No APK was produced."
            find packages/maui/testbed/bin -type f -name '*.apk*' || true
            exit 1
          fi
          cp "$found" artifact/sr-testbed.apk
          ls -lh artifact/

      # A green publish is not the same as a usable APK. The first APK this
      # workflow produced built, signed and uploaded cleanly, and App Live
      # rejected it: "Launcher activity was not found in AndroidManifest.xml".
      # The project had no Platforms/Android/MainActivity.cs, so nothing carried
      # MainLauncher = true and the app had no entry point.
      #
      # Inspect what is actually going to BrowserStack, not what MSBuild thinks
      # it did.
      - name: Verify the APK can actually launch
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt=$(find "$sdk/build-tools" -name 'aapt2' -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$aapt" ]; then
            aapt=$(find "$sdk/build-tools" -name 'aapt' -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$aapt" ]; then
            echo "::error::No aapt/aapt2 found under $sdk — cannot verify the APK."
            exit 1
          fi
          echo "Using $aapt"

          badging=$("$aapt" dump badging artifact/sr-testbed.apk)
          echo "$badging" | grep -E "^(package|launchable-activity|application-label):" || true

          if ! echo "$badging" | grep -q '^launchable-activity:'; then
            echo "::error::The APK has no launchable activity, so BrowserStack will reject it."
            echo "Check that Platforms/Android/MainActivity.cs exists and carries MainLauncher = true."
            exit 1
          fi
          echo "Launcher activity present."

      - uses: actions/upload-artifact@v4
        with:
          name: sr-testbed-apk
          path: artifact/sr-testbed.apk
          if-no-files-found: error
          retention-days: 30
