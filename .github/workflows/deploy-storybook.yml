name: Deploy Storybook to GitHub Pages

# Builds the design tokens and the Storybook static site, then publishes it to
# GitHub Pages. Runs on pushes to main (the canonical catalogue) and can also be
# triggered manually from the Actions tab ("Run workflow").
#
# One-time setup: in the repo Settings → Pages, set "Source" to "GitHub Actions".
#
# Note: pushes mirrored into another repo via a deploy key do NOT trigger
# workflows in that repo — run this manually there after a mirror.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build tokens + Storybook
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/storybook/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
