name: Deploy Storybook to GitHub Pages (preview)

# The PREVIEW surface (DDR-014): publishes the Storybook catalogue built from the
# current state of `main`. This is the working preview — NOT the gated, published
# design-system website (that is built from a release tag and added with the site
# build). Preview refreshes on a schedule plus a manual trigger, because the
# mirror's deploy-key push does NOT trigger workflows in the org repo.
#
# Runs only on the DHCW org repo (which has GitHub Pages). The personal repo has
# no Pages on its plan, so the job is guarded to skip there — no red-X noise.
#
# One-time setup (org repo): Settings → Pages → Source = "GitHub Actions".
#
# When the DS website ships, Storybook moves to the /catalogue/ subpath and the
# website takes the site root (see DDR-014).

on:
  schedule:
    # Every 30 minutes — safety net for the hosted preview. Tunable; use the
    # manual trigger below for an immediate refresh after a mirror.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    # Only the org repo has Pages; skip cleanly everywhere else (e.g. the
    # personal source repo, where a scheduled run would otherwise fail).
    if: github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build tokens + Storybook
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/storybook/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
