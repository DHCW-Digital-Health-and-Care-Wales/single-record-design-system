name: Release packages

# Packs the four consumer packages and attaches the tarballs to a GitHub
# Release, so a product team can install them with plain npm and no registry,
# no credentials and no Vite aliases.
#
# Why this exists: npm cannot install a single workspace out of a git
# repository. `npm install github:<org>/<repo>` fetches the monorepo ROOT — a
# private workspace container with no entry point — so consumers ended up
# hand-writing resolve.alias entries pointing inside node_modules to make it
# work. Tarballs are the standard answer while a package is not yet on a
# registry, and they behave exactly like registry packages once installed.
#
# This does not replace publishing (DDR-020). It removes the blocker while the
# scope decision is still open.
#
# RUN THIS ON THE PUBLIC ORG MIRROR, NOT HERE.
#
#   Release assets inherit the repository's visibility. This repo is private, so
#   an unauthenticated `npm install https://github.com/.../releases/download/...`
#   against it returns 404 — the release looks fine in the UI and is unusable to
#   a consumer. Cut releases on
#   DHCW-Digital-Health-and-Care-Wales/single-record-design-system, which is
#   public and is what the website's install instructions point at.
#
#   mirror-to-dhcw.yml pushes `HEAD:main` only, so tags do not travel to the
#   mirror. Trigger this workflow manually from the org repo's Actions tab with
#   the tag you want; `gh release create` creates the tag there if it is absent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or reuse, e.g. v0.1.0'
        required: true
        type: string
      publish_npm:
        description: 'Publish to npmjs.org as well as attaching tarballs'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Pack, verify and npm-publish --dry-run, but change nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Provenance signs each package against the commit and workflow that built
  # it, which needs an OIDC token. Read-only elsewhere.
  id-token: write

jobs:
  release:
    # Releases run in the DHCW org repo only (DDR-014, Gate 2). The same
    # workflow file exists in the personal upstream because the mirror copies
    # main wholesale, so without this guard a `v*` tag pushed upstream would
    # publish a second time from the wrong place. It skips there instead.
    #
    # The org repo cannot release automatically on a tag: the mirror pushes
    # `HEAD:main` only, so tags never arrive, and pushes made with a deploy key
    # do not trigger workflows regardless. Use "Run workflow" here and give it
    # the tag — that dispatch creates the tag as well as releasing it.
    if: github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Writes the .npmrc that `npm publish` reads. Without it the publish
          # goes to whatever registry happens to be configured, which on a
          # runner is nothing useful.
          registry-url: 'https://registry.npmjs.org'

      - name: Build everything the packages ship
        run: |
          npm ci
          npm run build:tokens
          npm run build:web
          npm run build:maui

      # A tarball built from stale generated files would install cleanly and be
      # wrong, which is worse than failing here.
      - name: Fail if generated output was committed stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated output differs from what the build produces. Run the builds and commit."
            git diff --stat
            exit 1
          fi

      - name: Pack the consumer packages
        run: |
          mkdir -p release
          for p in tokens icons web react; do
            npm pack "./packages/$p" --pack-destination release
          done
          ls -lh release/

          # The notes advertise $VERSION; prove that is what npm pack produced.
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          for p in tokens icons web react; do
            if [ ! -f "release/dhcw-sr-$p-$VERSION.tgz" ]; then
              echo "::error::Expected release/dhcw-sr-$p-$VERSION.tgz, which the release notes will link. Got:"
              ls release/
              exit 1
            fi
          done

      # Prove the tarballs are installable before publishing them, using a
      # throwaway project outside the workspace so no workspace linking can
      # make a broken tarball look fine.
      - name: Verify the tarballs actually install and resolve
        run: |
          work=$(mktemp -d)
          cp release/*.tgz "$work/"
          cd "$work"
          cat > package.json <<'JSON'
          { "name": "verify", "version": "1.0.0", "type": "module", "dependencies": {} }
          JSON
          npm install ./dhcw-sr-tokens-*.tgz ./dhcw-sr-icons-*.tgz \
                      ./dhcw-sr-web-*.tgz ./dhcw-sr-react-*.tgz --no-audit --no-fund

          node --input-type=module -e '
            const paths = [
              "@dhcw/sr-react",
              "@dhcw/sr-react/icon",
              "@dhcw/sr-web",
              "@dhcw/sr-web/dist/single-record.css",
              "@dhcw/sr-web/dist/sprite.svg",
              "@dhcw/sr-tokens",
              "@dhcw/sr-icons",
            ];
            let bad = 0;
            for (const p of paths) {
              try { import.meta.resolve(p); console.log("OK   " + p); }
              catch (e) { console.log("FAIL " + p + "  (" + e.code + ")"); bad++; }
            }
            if (bad) { console.error("\n" + bad + " import path(s) do not resolve from the packed tarballs."); process.exit(1); }
          '

      # ─── npm ─────────────────────────────────────────────────────────────
      #
      # Runs before the GitHub Release deliberately: if publishing fails, no
      # release should exist claiming the version shipped.
      #
      # Publishing is opt-in per run rather than automatic on a tag. Tarballs
      # have been the supported route for months and a registry publish is
      # irreversible — npm allows unpublish only within 72 hours, and never
      # re-publishing the same version afterwards. A tag should not be able to
      # push four packages to a public registry because somebody pushed it.
      - name: Pre-flight the npm publish
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on this repository. Add it under"
            echo "Settings > Secrets and variables > Actions before publishing."
            exit 1
          fi

          VERSION=$(node -p "require('./packages/tokens/package.json').version")

          # A version carrying a pre-release suffix (0.2.1-rc.0) must never
          # become `latest`, or every consumer on a caret range picks it up.
          # It goes to `next`, which is opt-in: npm install @dhcw/sr-tokens@next
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Version $VERSION will publish under dist-tag '$DIST_TAG'."

          # Dry-run all four BEFORE publishing any. npm has no transaction: a
          # failure on the third package leaves the first two published and
          # unpublishable at that version. This turns an auth, naming or
          # permission error into a clean stop instead of a half-release.
          for p in tokens icons web react; do
            echo "--- pre-flight @dhcw/sr-$p"
            npm publish "./packages/$p" --dry-run --access public --tag "$DIST_TAG"
          done

      - name: Publish to npmjs.org
        if: ${{ inputs.publish_npm && !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Dependency order: sr-react depends on the other three. A partial
          # publish then leaves a resolvable subset rather than a package whose
          # dependencies do not exist yet.
          #
          # --provenance signs each package against this commit and workflow,
          # which is why the packages' repository.url must name THIS repository.
          # It points at the org mirror for exactly that reason.
          for p in tokens icons web react; do
            echo "--- publishing @dhcw/sr-$p"
            npm publish "./packages/$p" --access public --provenance --tag "$DIST_TAG"
          done

          echo "PUBLISHED_NPM=true" >> "$GITHUB_ENV"

      # `--tag next` does not protect a package's FIRST publish. npm has to
      # point `latest` at something and there is no other version to choose, so
      # the first release candidate for a package becomes `latest` as well —
      # which means a bare `npm install @dhcw/sr-tokens` serves a prerelease.
      #
      # That happened on 0.2.1-rc.0 and was found by reading the registry
      # afterwards rather than by the workflow, which is the gap this closes.
      # It cannot be fixed here: `latest` cannot be unset, and with one version
      # published there is nowhere else to move it. So it reports, loudly, and
      # says what actually resolves it.
      - name: Warn if a prerelease became `latest`
        if: ${{ inputs.publish_npm && !inputs.dry_run }}
        run: |
          [ "${DIST_TAG:-latest}" = "latest" ] && exit 0

          bad=""
          for p in tokens icons web react; do
            actual=$(npm view "@dhcw/sr-$p" dist-tags.latest 2>/dev/null || echo "")
            echo "@dhcw/sr-$p: latest=$actual next=$(npm view "@dhcw/sr-$p" dist-tags.next 2>/dev/null || echo '')"
            [ "$actual" = "$VERSION" ] && bad="$bad @dhcw/sr-$p"
          done

          if [ -n "$bad" ]; then
            {
              echo "::warning::Prerelease $VERSION is also the 'latest' tag for:$bad"
              echo "A bare 'npm install' of these serves a prerelease. This happens on a"
              echo "package's first publish, when npm has no other version to point 'latest'"
              echo "at. It cannot be undone from here — publishing a stable version moves"
              echo "'latest' to it, which is the fix."
            } >&2
          fi

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Read the version rather than hardcoding it. These URLs carry BOTH
          # the tag and the package version, and the version half used to be
          # literal "0.1.0". The packages moved to 0.1.1 and nothing updated it,
          # so the release notes would have handed every consumer four URLs that
          # 404 — the release itself looking perfectly healthy.
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          echo "Packing version $VERSION under tag $TAG"

          # All four must agree, or the notes are right for some and wrong for
          # others. Cheaper to fail here than to publish a half-broken release.
          for p in icons web react; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$VERSION" ]; then
              echo "::error::packages/$p is $v but packages/tokens is $VERSION. Version the four together."
              exit 1
            fi
          done

          # Once a version is on the registry, that is the route a developer
          # should use. The tarballs stay in the release either way — they are
          # what a machine with no registry access installs from — but they
          # stop being the headline.
          npm_notes=""
          if [ "${PUBLISHED_NPM:-}" = "true" ]; then
            install_line="npm install @dhcw/sr-tokens @dhcw/sr-icons @dhcw/sr-web @dhcw/sr-react"
            if [ "${DIST_TAG:-latest}" != "latest" ]; then
              install_line="npm install @dhcw/sr-tokens@$DIST_TAG @dhcw/sr-icons@$DIST_TAG @dhcw/sr-web@$DIST_TAG @dhcw/sr-react@$DIST_TAG"
              pre_note="

          This is a **pre-release**, published under the \\\`$DIST_TAG\\\` tag. It is
          not picked up by a version range and will not reach anyone who does not
          ask for it by name."
            else
              pre_note=""
            fi
            npm_notes="## Install from npm

          \`\`\`
          $install_line
          \`\`\`

          Updates then arrive through \\\`npm update\\\` — no URLs to edit.$pre_note

          ---

          "
          fi

          notes="${npm_notes}## Install from the release tarballs

          No registry and no credentials. Add to \`package.json\`, then \`npm install\`:

          \`\`\`json
          \"dependencies\": {
            \"@dhcw/sr-tokens\": \"https://github.com/${{ github.repository }}/releases/download/$TAG/dhcw-sr-tokens-$VERSION.tgz\",
            \"@dhcw/sr-icons\":  \"https://github.com/${{ github.repository }}/releases/download/$TAG/dhcw-sr-icons-$VERSION.tgz\",
            \"@dhcw/sr-web\":    \"https://github.com/${{ github.repository }}/releases/download/$TAG/dhcw-sr-web-$VERSION.tgz\",
            \"@dhcw/sr-react\":  \"https://github.com/${{ github.repository }}/releases/download/$TAG/dhcw-sr-react-$VERSION.tgz\"
          }
          \`\`\`

          All four are needed together: the React package depends on the other three.
          No Vite aliases are required — if you have any pointing inside
          \`node_modules/@dhcw\`, delete them.

          ### Already on an earlier version?

          Both halves of each URL carry the version — the tag and the filename.
          Run this from your product repository rather than editing eight values
          by hand. It works on macOS, Linux and Windows:

          \`\`\`
          node -e \"const v='$VERSION',f='package.json',s=require('fs');s.writeFileSync(f,s.readFileSync(f,'utf8').replace(/\/download\/v[0-9.]+\/dhcw-sr-([a-z]+)-[0-9.]+\.tgz/g,'/download/v'+v+'/dhcw-sr-\$1-'+v+'.tgz'))\" && npm install
          \`\`\`"

          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" release/*.tgz --clobber \
            || gh release create "$TAG" release/*.tgz --title "$TAG" --notes "$notes"
