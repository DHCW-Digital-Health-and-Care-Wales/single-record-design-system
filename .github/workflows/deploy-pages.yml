name: Deploy DS site (website + Storybook) to GitHub Pages

# Single Pages publisher (DDR-016). Assembles ONE artifact:
#   /            → the DS website (packages/website)
#   /storybook/  → the Storybook catalogue (packages/storybook)
# Replaces the former deploy-storybook.yml and deploy-website.yml (which would
# have clobbered each other on one Pages site).
#
# The build job runs everywhere (PRs included) and uploads a downloadable
# artifact, so the Figma -> tokens -> site pipeline is exercised on every change.
# The deploy job is guarded to the org repo (which has Pages) and never runs on
# pull requests. Mirror-key pushes do NOT trigger workflows on the org repo — the
# schedule and manual dispatch cover post-mirror refreshes (DDR-014).
#
# One-time org setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'foundations/tokens/**'
      - 'packages/**'
      - 'scripts/assemble-pages.mjs'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    # Preview refresh safety net (mirror pushes don't trigger workflows on the org repo).
    # Hourly, not every 30 min: each run is a full `npm ci` + Storybook build, and
    # the schedule exists to cover mirror latency, not to be a live rebuild loop.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (website + Storybook)
    # The schedule is a safety net for the org repo only — it exists because
    # mirror-key pushes don't trigger workflows there (DDR-014). On the source
    # repo, pushes trigger this workflow directly, so a scheduled run rebuilds
    # and re-uploads an identical artifact for nothing. Left ungated, that was
    # 48 builds/day writing a ~10 MB artifact at the default 90-day retention,
    # which filled the account's 0.5 GB Actions storage quota and then failed
    # every subsequent run at the upload step ("Artifact storage quota has been
    # hit"). Push and pull_request runs are unaffected and still run everywhere.
    if: >-
      github.event_name != 'schedule' ||
      github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Build tokens, website, Storybook, and assemble
        run: npm run build:pages
      # Pull requests only. On a push to main the site is deployed to Pages by the
      # job below, so keeping a 3.25 MB copy of the same build as an artifact is
      # storage spent on something already published at a URL.
      # A convenience copy must never be able to fail the build. On 2026-09-11 a
      # PR that built perfectly went red on this step alone:
      #
      #   Failed to CreateArtifact: Artifact storage quota has been hit.
      #
      # The site and Storybook had assembled without error; the only thing that
      # failed was storing a downloadable copy of them. That is not a reason to
      # tell a contributor their change is broken, and with the quota full it
      # would have been every PR in the repository, not this one.
      #
      # The deploy job below is NOT given this treatment: publishing the site is
      # the actual output, and a silent failure there would leave the live site
      # stale with a green tick.
      - name: Upload site artifact (PR preview)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sr-site
          path: site-dist
          if-no-files-found: error
          # A preview/download convenience, not a record. Two days covers the life
          # of a review; the 7 it used to be outlived every reason to open one.
          retention-days: 2

  deploy:
    name: Deploy to GitHub Pages (org repo)
    needs: build
    # Only the org repo has Pages; never deploy on pull requests.
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'DHCW-Digital-Health-and-Care-Wales/single-record-design-system'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required by actions/checkout — a job-level permissions block resets all others to none
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deploy
        uses: actions/deploy-pages@v4
